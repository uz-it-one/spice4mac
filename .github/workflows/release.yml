name: Release
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate version and toolchain
        run: |
          test "$(uname -m)" = arm64
          python3 Build/version.py
          python3 Build/check-public-files.py
          xcodebuild -version
          xcrun --show-sdk-version
          mkdir -p Artifacts
      - name: Install native prerequisites
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew bundle --file Brewfile
      - name: Build protocol dependencies
        run: python3 Build/build-dependencies.py --server 2>&1 | tee Artifacts/dependencies.log
      - name: Build and package application
        run: ./Build/build-app.sh 2>&1 | tee Artifacts/build.log
      - name: Run unit and protocol integration tests
        run: ./Build/test.sh 2>&1 | tee Artifacts/tests.log
      - name: Assemble release assets
        run: |
          python3 Build/archive-app.py
          python3 Build/verify-app.py
          python3 Build/release-manifest.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            dist/Spice4Mac-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: build-logs
          path: Artifacts/*.log
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name release-assets --dir release-assets
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 Build/publish-release.py
